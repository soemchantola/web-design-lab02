<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
        background: pink;
        padding: 0px 10em 0px 10em;

      }
  
      .container {
        
        background: greenyellow;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        gap: 1em;

      }

      header,
      footer {
        background: grey;
        flex-grow: 0;
        height: 100px;
      }

      main {
        background: grey;
        flex-grow: 1;
      }

      div{
        border: 1px solid black;
      }



    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <main>Main</main>
      <footer>Footer</footer>
      </section>
    </div>
  </body>
</html>
