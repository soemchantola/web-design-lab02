<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: whitesmoke;
      }

      .main1 {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: 100% whitesmoke;
        flex-grow: 1;
      }
      .header {
        width: 510px;
        height: 10vh;
        display: flex;
        flex-grow: 1;
        background-color: #1e90ff;
        box-shadow: 0 4px 8px #0077ea;
        border-radius: 5px;
        justify-content: flex-start;
        padding-left: 10px;
        align-items: center;
        color: whitesmoke;
      }
      .content {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .main {
        display: flex;
        background: #3cb371;
        box-shadow: 0 4px 8px #2f8d59;
        border-radius: 0.5rem;
        width: 370px;
        height: 60vh;
        gap: 1rem;
        flex-wrap: wrap;
        padding-left: 10px;
        color: whitesmoke;
        padding-top: 10px;
        justify-content: flex-start;
        flex-grow: 1;
      }

      .item1 {
        flex-grow: 0;
        width: 70px;
        height: 50px;
        gap: 1rem;
        display: flex;
        background-color: #2f8d59;
        box-shadow: 0 4px 8px #226741;
        border-radius: 0.5rem;
        align-items: center;
        justify-content: center;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        color: whitesmoke;

        padding-left: 10px;
        flex-grow: 1;
        background: #ff6347;
        border-radius: 0.5rem;
        box-shadow: 0 4px 8px #e02200;
      }
      .footer {
        display: flex;
        flex-grow: 1;
        background-color: #4169e1;
        width: 510px;
        height: 10vh;
        border-radius: 0.5rem;
        box-shadow: 0 4px 8px #1d44b8;
        justify-content: flex-start;
        padding-left: 10px;
        align-items: center;
        color: whitesmoke;
      }
      .main h4 {
        width: 100%;
        margin: 0;
        padding-top: 10px;
      }
      .content {
        width: 520px;
        display: flex;
        flex-direction: row;
        gap: 1rem;
        flex-grow: 1;
      }
    </style>
  </head>

  <body>
    <div class="main1">
      <header class="header"><h4>Header</h4></header>
      <div class="content">
        <main class="main">
          <h4>Main</h4>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
          <div class="item1">Item</div>
        </main>
        <aside class="sidebar"><h4>Side Bar</h4></aside>
      </div>
      <footer class="footer"><h4>Footer</h4></footer>
    </div>
  </body>
</html>
